name: Build OptiCore VPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Restore stable OptiCore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: opticore-debug-keystore-v1

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify signing key
        run: ls -lh ~/.android/debug.keystore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OptiCore-VPN-Engine
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
