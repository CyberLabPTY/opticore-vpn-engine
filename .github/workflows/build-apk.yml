name: Build OptiCore VPN APK

permissions:
  contents: write

concurrency:
  group: opticore-build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - opticore-polish-v017
      - opticore-release-fix-v024
      - opticore-process-fix-v025
      - opticore-ui-restore-v026
      - opticore-panel-open-fix-v027
      - opticore-open-apps-v028
      - opticore-panel-return-v029
      - opticore-same-tab-v030
      - opticore-inline-close-v031
      - opticore-open-apps-fix-v032
      - opticore-recents-event-fix-v033
      - opticore-smart-fluency-v035
      - opticore-final-v036
      - opticore-final-v037
      - opticore-final-v038
      - opticore-final-v039
      - opticore-final-v040
      - opticore-final-v041-bridge
      - opticore-final-v042-dns
      - opticore-final-v043-persistent-pairing
      - opticore-final-v044-close-confirmation
      - opticore-final-v045-close-refresh-verify
      - opticore-v046-step2-dns-current
      - opticore-v046-step3-autolink
      # OptiCore 0.4.6 DNS test build enabled

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify unified web source
        run: |
          test -f web/index.html
          test -f web/app.js
          test -f web/styles.css
          test -f web/manifest.webmanifest
          test -f web/sw.js
          test -f web/bridge.js
          test -f web/icon-192.png
          test -f web/icon-512.png
          node --check web/app.js
          node --check web/bridge.js
          python -m json.tool web/manifest.webmanifest >/dev/null

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Restore stable OptiCore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: opticore-debug-keystore-v1

      - name: Verify one interface source for PWA and APK
        run: |
          gradle :app:generateOptiCorePanelAssets
          python - <<'PY'
          import hashlib, pathlib, zipfile, sys
          web = pathlib.Path("web")
          bundle = pathlib.Path("app/build/generated/opticorePanelAssets/panel-bundle.zip")
          required = ["index.html","styles.css","app.js","manifest.webmanifest","sw.js"]
          with zipfile.ZipFile(bundle) as z:
              for name in required:
                  a = (web / name).read_bytes()
                  b = z.read(name)
                  if a != b:
                      print(f"MISMATCH: {name}", file=sys.stderr)
                      sys.exit(1)
                  print(name, hashlib.sha256(a).hexdigest())
          print("PWA and embedded APK panel use identical canonical web files.")
          PY

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify signing key
        run: ls -lh ~/.android/debug.keystore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OptiCore-VPN-Engine
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Web/PWA preview
        uses: actions/upload-artifact@v4
        with:
          name: OptiCore-Web-PWA
          path: web/
          if-no-files-found: error

      - name: Publish direct OptiCore 0.4.3 test APK
        if: github.ref == 'refs/heads/opticore-final-v043-persistent-pairing'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk OptiCore-v0.4.3.apk
          gh release delete v0.4.3-test --cleanup-tag --yes || true
          gh release create v0.4.3-test OptiCore-v0.4.3.apk \
            --target "${GITHUB_SHA}" \
            --title "OptiCore 0.4.3 Test" \
            --notes "Build de prueba 0.4.3 con enlace persistente por dispositivo."

      - name: Publish direct OptiCore 0.4.4 test APK
        if: github.ref == 'refs/heads/opticore-final-v044-close-confirmation'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk OptiCore-v0.4.4.apk
          gh release delete v0.4.4-test --cleanup-tag --yes || true
          gh release create v0.4.4-test OptiCore-v0.4.4.apk \
            --target "${GITHUB_SHA}" \
            --title "OptiCore 0.4.4 Test" \
            --notes "Build de prueba 0.4.4 con verificacion retardada de cierre en Android Recents."

      - name: Publish direct OptiCore 0.4.5 test APK
        if: github.ref == 'refs/heads/opticore-final-v045-close-refresh-verify'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk OptiCore-v0.4.5.apk
          gh release delete v0.4.5-test --cleanup-tag --yes || true
          gh release create v0.4.5-test OptiCore-v0.4.5.apk \
            --target "${GITHUB_SHA}" \
            --title "OptiCore 0.4.5 Test" \
            --notes "Build de prueba 0.4.5 con verificacion de cierre tras reabrir Android Recents."

      - name: Publish direct OptiCore 0.4.6 test1 APK
        if: github.ref == 'refs/heads/opticore-v046-step2-dns-current'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk OptiCore-v0.4.6-test1.apk
          gh release delete v0.4.6-test1 --cleanup-tag --yes || true
          gh release create v0.4.6-test1 OptiCore-v0.4.6-test1.apk \
            --target "${GITHUB_SHA}" \
            --title "OptiCore 0.4.6 Test 1" \
            --notes "Build de prueba 0.4.6-test1 con lectura del DNS actual de Android y Private DNS."



      - name: Publish direct OptiCore 0.4.6 test2 APK
        if: github.ref == 'refs/heads/opticore-v046-step3-autolink'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk OptiCore-v0.4.6-test2.apk
          gh release delete v0.4.6-test2 --cleanup-tag --yes || true
          gh release create v0.4.6-test2 OptiCore-v0.4.6-test2.apk \
            --target "${GITHUB_SHA}" \
            --title "OptiCore 0.4.6 Test 2" \
            --notes "Build de prueba 0.4.6-test2 con Auto-Link persistente y recuperacion automatica del bridge web/PWA."
